name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-windows.yml'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Node.js 설치
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 프로젝트 파일 생성
        shell: bash
        run: |
          mkdir -p app
          echo '' | base64 -d > app/package.json
          echo '' | base64 -d > app/main.js
          echo "=== package.json ==="; cat app/package.json
          echo "=== main.js (head) ==="; head -5 app/main.js

      - name: 의존성 설치 및 빌드
        shell: bash
        working-directory: app
        run: |
          npm install
          npm run dist

      - name: 결과물(.exe) 업로드
        uses: actions/upload-artifact@v4
        with:
          name: 세무고객관리-Windows-설치파일
          path: app/dist/*.exe
          if-no-files-found: error
